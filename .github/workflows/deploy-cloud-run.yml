name: Deploy to Google Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'server.ts'
      - 'package.json'
      - 'Dockerfile'
      - '.github/workflows/deploy-cloud-run.yml'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build-push-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ secrets.GCP_REGION }}
      AR_REPO: ${{ secrets.GCP_ARTIFACT_REGISTRY }}
      SERVICE_NAME: ${{ secrets.GCP_SERVICE_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Debug auth identity
        run: |
          echo "=== Active gcloud account ==="
          gcloud auth list
          echo "=== AR repos ==="
          gcloud artifacts repositories list --location=${{ env.REGION }} 2>&1 | head -30

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker image
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/urbont-api:${SHORT_SHA}"
          IMAGE_LATEST="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/urbont-api:latest"
          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV
          echo "=== Pushing to: ${IMAGE} ==="
          docker build \
            --tag "${IMAGE}" \
            --tag "${IMAGE_LATEST}" \
            .
          docker push "${IMAGE}"
          docker push "${IMAGE_LATEST}"
          echo "Pushed: ${IMAGE}"

      - name: Write env-vars file
        env:
          NODE_ENV: production
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_MAP_ID: ""
          VITE_GOOGLE_MAPS_MAP_ID: ""
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          AVIATION_STACK_KEY: ${{ secrets.AVIATION_STACK_KEY }}
          ADMIN_SECRET_KEY: ${{ secrets.ADMIN_SECRET_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          FIREBASE_VAPID_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ALLOWED_ORIGIN: ${{ secrets.ALLOWED_ORIGIN }}
          SETUP_SECRET: ${{ secrets.SETUP_SECRET }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
        run: |
          python3 - <<'PYEOF'
          import os, json

          keys = [
            "NODE_ENV","SUPABASE_URL","SUPABASE_ANON_KEY","SUPABASE_SERVICE_ROLE_KEY",
            "SUPABASE_DB_URL","JWT_SECRET","GOOGLE_MAPS_API_KEY","VITE_GOOGLE_MAPS_API_KEY",
            "STRIPE_SECRET_KEY","VITE_STRIPE_PUBLISHABLE_KEY","STRIPE_PUBLISHABLE_KEY",
            "STRIPE_WEBHOOK_SECRET","TWILIO_ACCOUNT_SID","TWILIO_AUTH_TOKEN",
            "TWILIO_PHONE_NUMBER","AVIATION_STACK_KEY","ADMIN_SECRET_KEY",
            "FIREBASE_SERVICE_ACCOUNT","VAPID_PUBLIC_KEY","VAPID_PRIVATE_KEY",
            "VITE_FIREBASE_VAPID_KEY","FIREBASE_VAPID_KEY","RESEND_API_KEY",
            "EMAIL_FROM","GROK_API_KEY","SENTRY_DSN","ALLOWED_ORIGIN","SETUP_SECRET","ADMIN_JWT_SECRET","GOOGLE_MAPS_MAP_ID","VITE_GOOGLE_MAPS_MAP_ID"
          ]

          lines = []
          for k in keys:
            v = os.environ.get(k, "")
            if v:
              # YAML-safe: wrap value in single quotes, escape any single quotes inside
              safe = v.replace("'", "''")
              lines.append(f"{k}: '{safe}'")

          with open("env.yaml", "w") as f:
            f.write("\n".join(lines) + "\n")

          print(f"env.yaml written with {len(lines)} vars")
          PYEOF

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${{ env.IMAGE }}" \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --min-instances=1 \
            --max-instances=10 \
            --memory=512Mi \
            --cpu=1 \
            --concurrency=80 \
            --timeout=60s \
            --port=8080 \
            --liveness-probe=httpGet.path=/api/healthz,httpGet.port=8080,initialDelaySeconds=10,periodSeconds=30,failureThreshold=3 \
            --startup-probe=httpGet.path=/api/healthz,httpGet.port=8080,initialDelaySeconds=5,periodSeconds=5,failureThreshold=12 \
            --env-vars-file env.yaml

      - name: Show deployed URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format='value(status.url)')
          echo "================================"
          echo "DEPLOYED:  ${URL}"
          echo "HEALTH:    ${URL}/api/healthz"
          echo "================================"
